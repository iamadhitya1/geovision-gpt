[project]
name = "geovisiongpt-model"
version = "0.1.0"
description = "GeoVisionGPT — VQA model: LiT-4-RSVQA-style architecture, training and evaluation on RSVQA-LR"
requires-python = ">=3.11,<3.12"

dependencies = [
    # CPU builds here (dev machine has no GPU); the exact same code runs unmodified on
    # the institute HPC once torch is installed there with CUDA support — device
    # selection is a single line (see resolve_device() in scripts/train.py), not a rewrite.
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.44.0",   # BERT-Tiny (google/bert_uncased_L-2_H-128_A-2)
    "sentencepiece>=0.2.0",   # some tokenizer backends need this even when unused directly —
                               # without it, AutoTokenizer.from_pretrained can raise ValueError
                               # instead of falling back automatically
    "timm>=1.0.9",            # DeiT-Tiny / MobileViT-S / XCiT-Nano, pretrained
    "pillow>=11.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",    # accuracy/precision reporting utilities
    "tqdm>=4.66.0",
    "matplotlib>=3.9.0",      # training-curve and confusion-matrix plots for the report
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models", "dataset", "scripts"]
# The actual downloaded dataset (~150MB of images/JSON) must never end up bundled inside
# the installable package — it's data consumed at a fixed relative path on disk (see
# DATA_ROOT in scripts/*.py), not something pip should copy into site-packages. Without
# this, `backend/`'s "geovisiongpt-model" dependency would silently balloon by 150MB on
# every install.
exclude = ["dataset/rsvqa_lr/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
