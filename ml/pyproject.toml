[project]
name = "geovisiongpt-model"
version = "0.1.0"
description = "GeoVisionGPT — VQA model: LiT-4-RSVQA-style architecture, training and evaluation on RSVQA-LR"
requires-python = ">=3.11,<3.12"

dependencies = [
    # CPU builds here (dev machine has no GPU); the exact same code runs unmodified on
    # the institute HPC once torch is installed there with CUDA support — device
    # selection is a single line (see models/device.py), not a rewrite.
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.44.0",   # BERT-Tiny
    "sentencepiece>=0.2.0",   # required to build prajjwal1/bert-tiny's tokenizer on this
                               # transformers version — without it, AutoTokenizer.from_pretrained
                               # raises ValueError instead of falling back automatically
    "timm>=1.0.9",            # DeiT-Tiny / MobileViT-S / XCiT-Nano, pretrained
    "pillow>=11.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",    # accuracy/precision reporting utilities
    "tqdm>=4.66.0",
    "matplotlib>=3.9.0",      # training-curve and confusion-matrix plots for the report
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models", "data", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
