# Reverse proxy for the local-full and production profiles.
#
# This is the actual trust boundary the application code assumes: app/api/deps.py's
# client_ip() trusts X-Forwarded-For specifically because *this* proxy is the first hop
# from the internet and overwrites the header rather than appending to it. Without this
# proxy in front of the api service, a caller could set X-Forwarded-For directly and
# spoof their source IP to bypass per-IP rate limiting.

events {
    worker_connections 1024;
}

http {
    # Real IP as seen by NGINX itself — deliberately replaces any client-supplied value
    # rather than appending to it, since NGINX is the first hop, not a link in a longer
    # trusted chain.
    map $remote_addr $client_real_ip {
        default $remote_addr;
    }

    upstream api_backend {
        server api:8000;
    }

    server {
        listen 80;
        client_max_body_size 100M;  # headroom for satellite image uploads (Module 2)

        location /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            # Overwrite, not append: this is the trust boundary client_ip() relies on.
            proxy_set_header X-Forwarded-For $client_real_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
        }

        location /docs {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }
    }
}
