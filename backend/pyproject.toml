[project]
name = "geovisiongpt-backend"
version = "0.1.0"
description = "GeoVisionGPT — Multi-Modal VQA for Satellite and Earth Observation Imagery"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "pyjwt>=2.9.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "rasterio>=1.4.0",
    "pillow>=11.0.0",
    "boto3>=1.35.0",
    # The trained VQA model itself — torch/transformers/timm come in transitively via
    # this package's own dependencies (see ml/pyproject.toml), so training and serving
    # can never silently drift onto two different architectures. Resolved to ../ml via
    # [tool.uv.sources] below, uv's supported mechanism for a local path dependency.
    # Editable on purpose: a plain path dependency installs a frozen COPY of ml/, so model
    # changes silently never reached the app (the cross-attention fix didn't, at first).
    "geovisiongpt-model",
]

[tool.uv.sources]
geovisiongpt-model = { path = "../ml", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "boto3-stubs[s3]>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Required for the "geovisiongpt-model @ file:../ml" dependency above — hatchling refuses
# a direct path/URL reference otherwise. Safe here: it's this project's own sibling
# package, not an untrusted third party.
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# rasterio's type stubs are incomplete for strict mode; the modules that touch it are
# kept small and reviewed by hand instead of leaning on static checking there.
[[tool.mypy.overrides]]
module = ["rasterio.*"]
ignore_missing_imports = true

# Same reasoning for torch/transformers/timm and the ml/ package itself, which has no
# strict-mypy setup of its own (it's a training codebase, not this project's API surface).
[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "timm.*", "models.*", "dataset.*", "PIL.*"]
ignore_missing_imports = true
