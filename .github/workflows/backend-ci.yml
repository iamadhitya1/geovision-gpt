name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      # Runs on SQLite + in-memory cache, so no service containers are needed and the
      # job stays under a minute.
      - name: Test
        env:
          GVG_SECRET_KEY: ci-secret-key-that-is-at-least-32-characters-long
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml

  migrations:
    name: Migrations apply and reverse cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geovision
          POSTGRES_PASSWORD: geovision
          POSTGRES_DB: geovision
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U geovision"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GVG_SECRET_KEY: ci-secret-key-that-is-at-least-32-characters-long
      GVG_DATABASE_URL: postgresql+asyncpg://geovision:geovision@localhost:5432/geovision

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"

      - name: Upgrade to head
        run: uv run alembic upgrade head

      # A migration that cannot be reversed cannot be rolled back in production, so the
      # downgrade path is exercised on every change rather than trusted.
      - name: Downgrade to base
        run: uv run alembic downgrade base

      - name: Re-apply
        run: uv run alembic upgrade head

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
